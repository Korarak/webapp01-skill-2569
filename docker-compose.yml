services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: expense_tracker
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on: [db]

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: expense_tracker
      JWT_SECRET: change-me
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on: [db]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on: [backend]

volumes:
  db_data:
